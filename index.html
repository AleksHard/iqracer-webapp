<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IQRacer — Сканер QR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
  }
  .wrap {
    text-align: center;
    padding: 24px;
  }
  .icon {
    font-size: 64px;
    margin-bottom: 16px;
  }
  button {
    font-size: 18px;
    padding: 14px 28px;
    border-radius: 12px;
    border: none;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    cursor: pointer;
  }
  .hint {
    margin-top: 16px;
    font-size: 14px;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📷</div>
    <button id="scanBtn">Сканировать QR-код</button>
    <div class="hint">Наведите камеру на QR-код на чекпоинте</div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  document.getElementById('scanBtn').addEventListener('click', function () {
    tg.showScanQrPopup({ text: 'Наведите камеру на QR-код чекпоинта' }, function (text) {
      if (text) {
        // Отправляем считанный код боту и сразу закрываем окно сканера
        tg.closeScanQrPopup();
        tg.sendData(text);
        tg.close();
      }
      // Возвращаем true, чтобы попап сканера остался открыт для повторной попытки,
      // если ничего не считалось (например, код нечитаемый) — но мы уже отправили
      // и закрыли выше при успехе, так что здесь просто ничего не делаем.
    });
  });

  // Если WebApp открыт не из Telegram (например, напрямую в браузере при тестировании),
  // showScanQrPopup будет недоступен — на всякий случай подстрахуемся.
  if (!tg.showScanQrPopup) {
    document.querySelector('.hint').textContent =
      'Откройте эту страницу через кнопку в боте Telegram, чтобы сканер заработал.';
  }
</script>
</body>
</html>
